# Postgres 17 + pgvector — the data foundation for atlas-photos and the
# knowledge graph.
#
#   docker compose up -d
#   docker compose logs -f
#
# The project name is set explicitly. Without it compose derives one from the
# directory, which here is "docker" — a name that says nothing and collides
# with every other stack checked out into a docker/ folder. The volume is
# therefore atlas-backend_pgdata.
name: atlas-backend

services:
  postgres:
    # Pinned by tag AND digest: the tag says which version this is, the digest
    # is what actually gets pulled, so a re-tagged upstream cannot change the
    # database engine under a live library. Bump both together.
    image: pgvector/pgvector:pg17@sha256:d2ef61f42ef767baa5a1475393303cc235bcd92febd9d7014eddb48b41f3bad0
    container_name: atlas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: atlas
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    ports:
      - "127.0.0.1:5432:5432"   # localhost only — remote dev via `atlas` ssh tunnel
    volumes:
      - pgdata:/var/lib/postgresql/data
    shm_size: 1g                 # HNSW index builds like real shared memory
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
