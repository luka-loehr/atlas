[package]
name = "atlas-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The Atlas backend: photo library, drive and machine status behind one HTTP API, plus the ingest workers"

[[bin]]
name = "atlas-server"
path = "src/main.rs"

[dependencies]
atlas-core = { path = "../core" }
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
deadpool-postgres.workspace = true
image.workspace = true
pgvector.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-postgres.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

axum = { version = "0.8", features = ["ws"] }
base64 = "0.23"
bytes = "1"
chrono-tz = "0.10"
crc32fast = "1"
fast_image_resize = "5"
flate2 = "1"
futures-util = "0.3"
kamadak-exif = "0.6"
libc = "0.2"
libheif-rs = "2"
nvml-wrapper = "0.13"
portable-pty = "0.9"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
reverse_geocoder = "4"
sha2 = "0.10"
thumbhash = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["fs", "compression-gzip", "compression-br", "compression-zstd"] }
webp = "0.3"
zip = { version = "2", default-features = false, features = ["deflate"] }
