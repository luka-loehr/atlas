name: Atlas
options:
  bundleIdPrefix: com.lukaloehr
  deploymentTarget:
    iOS: "26.1"
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    MARKETING_VERSION: "0.5.28"
    CURRENT_PROJECT_VERSION: "40"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Signing is the builder's own: pass DEVELOPMENT_TEAM (and allow
    # provisioning updates) on the xcodebuild command line, see app/README.md.
    CODE_SIGN_STYLE: Automatic

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    # 1.12 and later ship Metal shaders, which need Xcode's optional Metal
    # toolchain; this is the newest version that builds without it.
    exactVersion: "1.11.2"
  # The Mac app updates itself from the GitHub releases (see
  # scripts/release-mac.sh): an appcast and EdDSA-signed, notarized builds.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"

targets:
  # One app target for iPhone, iPad and Mac. On the Mac it is a native
  # AppKit-hosted SwiftUI app (not Mac Catalyst, not "Designed for iPad"):
  # the model, cache and networking layer is shared, each platform has its
  # own interface, following its Human Interface Guidelines.
  #   Atlas/       shared by both platforms
  #   Atlas/iOS/   the iPhone and iPad interface, backup, widget staging
  #   Mac/         the Mac interface: window, sidebar, menus, settings
  Atlas:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Atlas
        excludes:
          - "iOS/**"
      - path: Atlas/iOS
        destinationFilters: [iOS]
      - path: Mac
        destinationFilters: [macOS]
        excludes:
          - Info.plist
          - "*.entitlements"
      - path: Shared
        destinationFilters: [iOS]
    dependencies:
      - package: SwiftTerm
      - package: Sparkle
        destinationFilters: [macOS]
      - target: AtlasWidget
        destinationFilters: [iOS]
    entitlements:
      path: Atlas/Atlas.entitlements
      properties:
        # the Album widget's photos and manifest (see Shared/WidgetData.swift)
        com.apple.security.application-groups:
          - group.com.lukaloehr.atlas.ios
    info:
      path: Atlas/Info.plist
      properties:
        CFBundleDisplayName: Atlas
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.lukaloehr.atlas.ios
            CFBundleURLSchemes: [atlas]
        UIBackgroundModes:
          - processing
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.lukaloehr.atlas.ios.backup
          - com.lukaloehr.atlas.ios.refresh
        NSFaceIDUsageDescription: Face ID unlocks your Locked album.
        NSPhotoLibraryUsageDescription: Atlas backs up your photos and videos to your own server, and can remove backed-up items from this iPhone to free space.
        NSPhotoLibraryAddUsageDescription: Atlas saves photos and videos from your server to this iPhone.
        NSLocalNetworkUsageDescription: Atlas connects to your server on your network.
        # A self-hosted server is reached over a private network: by IP or
        # local name, or by its tailnet name, where WireGuard already
        # encrypts the path. Anything else has to be HTTPS.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lukaloehr.atlas.ios
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
        # The Mac app has its own Info.plist and entitlements: App Sandbox
        # (network client, files the user picks, Downloads) and the
        # hardened runtime, as Apple requires for Mac apps.
        INFOPLIST_FILE[sdk=macosx*]: Mac/Info.plist
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: Mac/Atlas.entitlements
        # a Mac app keeps its frameworks (Sparkle) in Contents/Frameworks
        LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]: "$(inherited) @executable_path/../Frameworks"
        ENABLE_HARDENED_RUNTIME[sdk=macosx*]: YES
        ENABLE_APP_SANDBOX[sdk=macosx*]: YES
        COMBINE_HIDPI_IMAGES[sdk=macosx*]: YES
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS:
          enabled: 1

  AtlasWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: AtlasWidget
      - path: Shared
    entitlements:
      path: AtlasWidget/AtlasWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.lukaloehr.atlas.ios
    info:
      path: AtlasWidget/Info.plist
      properties:
        CFBundleDisplayName: Atlas
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lukaloehr.atlas.ios.widget
        SKIP_INSTALL: YES
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS:
          enabled: 1
