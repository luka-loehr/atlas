# Builds, lints and tests the server and the CLI on every push and pull
# request. atlas-ml needs CUDA, so it does not run here. On macOS, because
# the server needs libheif 1.21 or later, which Homebrew has and Ubuntu has
# only from 26.04 on.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: brew install libheif pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
