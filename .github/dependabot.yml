version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: swift
    directory: /app
    schedule:
      interval: weekly
    ignore:
      # pinned in app/project.yml: 1.12 and later need the Metal toolchain
      # at build time
      - dependency-name: github.com/migueldeicaza/swiftterm
  - package-ecosystem: docker
    directories:
      - /db
      - /builder/universal
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
