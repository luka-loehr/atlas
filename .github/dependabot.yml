# One grouped pull request per ecosystem and month, instead of one per
# dependency: easy to review, test once and merge.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: swift
    directory: /app
    schedule:
      interval: monthly
    groups:
      swift:
        patterns: ["*"]
    ignore:
      # pinned in app/project.yml: 1.12 and later need the Metal toolchain
      # at build time
      - dependency-name: github.com/migueldeicaza/swiftterm
  - package-ecosystem: docker
    directories:
      - /db
      - /builder/universal
    schedule:
      interval: monthly
    groups:
      docker:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
