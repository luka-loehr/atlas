version: 2
updates:
  - package-ecosystem: cargo
    directories:
      - /api
      - /apps/atlas-photos/server
      - /cli
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directories:
      - /apps/atlas-photos/ingest
      - /lightshows/analyze
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: docker
    directory: /builder/universal
    schedule:
      interval: weekly
